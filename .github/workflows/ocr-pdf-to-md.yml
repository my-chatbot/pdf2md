name: OCR PDFs (Tesseract)

on:
  workflow_dispatch:
  push:
    paths:
      - 'document/**/*.pdf'

permissions:
  contents: write

# the merge job commits to the branch; let a second push queue behind it
# rather than race it into a rejected push.
concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Queen: count documents and size the shard matrix ----
  # Sharding is by document, not by page: each worker converts whole documents.
  # Page-range sharding cannot work here, since the corpus runs from 1 to 389
  # pages and one range applied to every document is wrong for all but one.
  queen:
    runs-on: ubuntu-latest
    outputs:
      total_docs: ${{ steps.count.outputs.total_docs }}
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Count documents
        id: count
        run: |
          COUNT=$(find document -type f -iname '*.pdf' | wc -l)
          MAX=10
          SHARDS=$(( COUNT < MAX ? COUNT : MAX ))
          echo "total_docs=$COUNT" >> $GITHUB_OUTPUT
          # matrix sized to the corpus, so no shard is ever empty
          if [ "$SHARDS" -gt 0 ]; then
            echo "shards=[$(seq -s, 1 $SHARDS)]" >> $GITHUB_OUTPUT
          else
            echo "shards=[]" >> $GITHUB_OUTPUT
          fi
          echo "$COUNT documents across $SHARDS shards"

  # ---- Workers: parallel runners, each converting its own documents ----
  workers:
    needs: queen
    if: needs.queen.outputs.total_docs > 0
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.queen.outputs.shards) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nep poppler-utils
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # Work is split at --chunk page granularity, so a shard holds pieces of a
      # document rather than whole ones -- it caches pages and writes no .md.
      # The merge job does the single assembly pass once every cache is in place.
      - name: Run OCR (shard)
        run: |
          python3 scripts/pdf2md.py \
            --in document \
            --out shard-out \
            --shard ${{ matrix.shard }} \
            --total-shards ${{ strategy.job-total }} \
            --chunk 10 \
            --workers 2 \
            --dpi 300 \
            --lang nep+eng \
            --probe \
            --markers
      - name: Upload shard cache
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-out/
          # caches are .<doc>.pages/ dirs; v4 skips dotfiles unless told otherwise,
          # and without this every artifact uploads empty
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # ---- Merge: collect every shard's documents and commit ----
  merge:
    needs: [queen, workers]
    if: needs.queen.outputs.total_docs > 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # downloaded outside output/, so a failed cleanup can never get committed
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Assemble page caches
        run: |
          # cp -a overlays same-named .<doc>.pages/ dirs instead of replacing them,
          # which is what brings pieces of one document from different shards
          # together into a single cache
          FOUND=$(find incoming -name 'page-*.md' | wc -l)
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::no shard produced any pages"
            exit 1
          fi
          mkdir -p output
          for d in incoming/shard-*/; do cp -a "$d." output/; done
          rm -rf incoming
          echo "✅ overlaid $FOUND cached pages"
      - name: Merge documents
        # fails loudly if any document is missing pages, rather than committing
        # a truncated .md that would look complete to everything downstream
        run: python3 scripts/pdf2md.py --in document --out output --merge-only
      - name: Upload final Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-markdown
          path: output/*.md
          retention-days: 1

      - name: Commit final files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref }} --rebase || true
          git add output/
          git diff --staged --quiet || git commit -m "📝 OCR: Markdown for $(git diff --staged --name-only | wc -l) document(s)"
          git push origin HEAD:${{ github.ref }}
