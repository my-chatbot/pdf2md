name: OCR PDFs (Tesseract)

on:
  workflow_dispatch:
  push:
    paths:
      - 'document/**/*.pdf'

permissions:
  contents: write

# the merge job commits to the branch; let a second push queue behind it
# rather than race it into a rejected push.
concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Queen: count documents and size the shard matrix ----
  # Sharding is by document, not by page: each worker converts whole documents.
  # Page-range sharding cannot work here, since the corpus runs from 1 to 389
  # pages and one range applied to every document is wrong for all but one.
  queen:
    runs-on: ubuntu-latest
    outputs:
      total_docs: ${{ steps.count.outputs.total_docs }}
      shards: ${{ steps.count.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - name: Count documents
        id: count
        run: |
          COUNT=$(find document -type f -iname '*.pdf' | wc -l)
          MAX=10
          SHARDS=$(( COUNT < MAX ? COUNT : MAX ))
          echo "total_docs=$COUNT" >> $GITHUB_OUTPUT
          # matrix sized to the corpus, so no shard is ever empty
          if [ "$SHARDS" -gt 0 ]; then
            echo "shards=[$(seq -s, 1 $SHARDS)]" >> $GITHUB_OUTPUT
          else
            echo "shards=[]" >> $GITHUB_OUTPUT
          fi
          echo "$COUNT documents across $SHARDS shards"

  # ---- Workers: parallel runners, each converting its own documents ----
  workers:
    needs: queen
    if: needs.queen.outputs.total_docs > 0
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        shard: ${{ fromJSON(needs.queen.outputs.shards) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nep poppler-utils
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # writes to shard-out/, not output/: output/ holds .md files already
      # committed to the repo, and uploading those would let a stale checked-in
      # copy overwrite a freshly OCR'd one at merge time.
      - name: Run OCR (shard)
        run: |
          python3 scripts/pdf2md.py \
            --in document \
            --out shard-out \
            --shard ${{ matrix.shard }} \
            --total-shards ${{ strategy.job-total }} \
            --force \
            --workers 2 \
            --dpi 300 \
            --lang nep+eng \
            --probe \
            --markers
      - name: Upload shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-out/*.md
          if-no-files-found: error
          retention-days: 1

  # ---- Merge: collect every shard's documents and commit ----
  merge:
    needs: [queen, workers]
    if: needs.queen.outputs.total_docs > 0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # downloaded outside output/, so a failed cleanup can never get committed
      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect shard outputs
        run: |
          # every document is produced complete by exactly one shard, so this is
          # a move -- there is nothing to concatenate and no ordering to get right
          FOUND=$(find incoming -name '*.md' | wc -l)
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::no shard produced any Markdown"
            exit 1
          fi
          find incoming -name '*.md' -exec mv -t output/ {} +
          rm -rf incoming
          echo "✅ collected $FOUND documents"
      - name: Upload final Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-markdown
          path: output/*.md
          retention-days: 1

      - name: Commit final files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref }} --rebase || true
          git add output/
          git diff --staged --quiet || git commit -m "📝 OCR: Markdown for $(git diff --staged --name-only | wc -l) document(s)"
          git push origin HEAD:${{ github.ref }}
