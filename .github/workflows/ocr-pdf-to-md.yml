name: OCR PDFs (Tesseract)

on:
  workflow_dispatch:
  push:
    paths:
      - 'document/**/*.pdf'

permissions:
  contents: write

# the merge job commits to the branch; let a second push queue behind it
# rather than race it into a rejected push.
concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Queen: split the unconverted documents into balanced batches ----
  # Not one job per PDF: a matrix is capped at 256 jobs and this corpus is 358
  # documents, so that model cannot start at all. Batching also stops the corpus
  # size from setting the setup bill -- 358 jobs would spend ~27 min just doing
  # checkout and apt before any OCR.
  #
  # A document already having its .md is dropped here rather than skipped in the
  # worker, so an unchanged corpus spawns no jobs at all and a rerun after a
  # partial failure only retries what actually failed.
  # ---- Test: seconds, and it gates everything expensive ----
  # The bug that motivated this ran fine for 37 documents and then died in the
  # merge step of a 1173-page one -- after every page had been OCR'd. Ten seconds
  # here is the difference between catching that and paying half an hour of runner
  # time per affected document to find out.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test_pdf2md.py

  queen:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.list.outputs.docs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get install -y poppler-utils

      - name: Split into balanced batches
        id: list
        # python, not bash: these filenames are Devanagari and json.dumps gets
        # the quoting right for the matrix
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, subprocess, sys
          from pathlib import Path

          # Ten batches is the floor, and the number stays 10 until a batch would
          # get too big to finish. A GitHub-hosted job is killed at 6 hours, so a
          # batch is capped at PAGES_PER_JOB (~3.1 h at the measured 2.77 s/page)
          # and the count grows past 10 only when the corpus forces it. Anything
          # over 10 simply queues behind max-parallel, which is correct.
          JOBS_MIN, PAGES_PER_JOB, MATRIX_CAP = 20, 4000, 256
          root, out = Path("document"), Path("output")
          todo, done = [], 0
          for pdf in sorted(root.rglob("*.pdf")):
              rel = pdf.relative_to(root)
              if (out / rel.with_suffix(".md")).exists():
                  done += 1
                  continue
              todo.append(rel)

          # Page counts, so batches can be balanced by work rather than by count.
          # Splitting 358 name-sorted bulletins into contiguous equal-count slices
          # measured 129 min for the slowest batch against 98 min balanced -- the
          # documents run 10 to 276 pages and size tracks the name order.
          def pages(rel):
              info = subprocess.run(["pdfinfo", str(root / rel)],
                                    capture_output=True, text=True).stdout
              m = re.search(r"^Pages:\s+(\d+)", info, re.M)
              return int(m.group(1)) if m else 1

          sized = sorted(((pages(r), r) for r in todo), key=lambda x: -x[0])
          total = sum(n for n, _ in sized)
          jobs = max(JOBS_MIN, -(-total // PAGES_PER_JOB))     # ceiling division
          # never more batches than documents (no empty jobs) or than the cap
          jobs = max(1, min(jobs, MATRIX_CAP, len(todo)))
          bins = [[] for _ in range(jobs)]
          for n, rel in sized:                    # greedy: largest into emptiest
              bins.sort(key=lambda b: sum(p for p, _ in b))
              bins[0].append((n, rel))
          bins = [b for b in bins if b]

          batches = [{"idx": i + 1,
                      "docs": "\n".join(str(r) for _, r in sorted(b, key=lambda x: str(x[1])))}
                     for i, b in enumerate(bins)]
          print(f"docs={json.dumps(batches, ensure_ascii=False)}")
          print(f"count={len(todo)}")
          loads = [sum(p for p, _ in b) for b in bins]
          print(f"::notice::{len(todo)} to convert, {done} already done, "
                f"{len(bins)} batches of {min(loads) if loads else 0}-"
                f"{max(loads) if loads else 0} pages", file=sys.stderr)
          PY

  # ---- Workers: one balanced batch of documents each ----
  # Ten batches and ten slots, so every batch starts at once and none queues.
  # Each converts whole documents, so nothing needs reassembling afterwards.
  workers:
    needs: queen
    if: needs.queen.outputs.count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: batch ${{ matrix.idx }}
    strategy:
      max-parallel: 20   # literal: the strategy block cannot read env or vars
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.queen.outputs.docs) }}

    steps:
      - uses: actions/checkout@v4

      # the script is stdlib-only, so there is nothing to pip install
      - name: Install system dependencies
        run: |
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nep poppler-utils

      # writes to shard-out/, not output/: output/ holds the .md files already
      # committed, and uploading those would republish them from every job
      - name: Convert
        env:
          # through a file, never the command line: these are Devanagari filenames
          # and nothing about them should have to survive shell quoting
          DOCS: ${{ matrix.docs }}
        run: |
          printf '%s\n' "$DOCS" > batch.txt
          wc -l < batch.txt | sed 's/^/documents in this batch: /'
          # no --workers: it defaults to the usable core count, so the pool tracks
          # whatever the runner actually has (4 today) instead of being pinned to a
          # number that has to be revisited when GitHub changes runner sizes. Each
          # worker runs one tesseract with OMP_THREAD_LIMIT=1, so workers == cores.
          python3 scripts/pdf2md.py \
            --in document \
            --out shard-out \
            --only-list batch.txt \
            --dpi 300 \
            --lang nep+eng \
            --probe \
            --markers
      - name: Upload batch
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ matrix.idx }}
          path: shard-out/
          if-no-files-found: error
          retention-days: 1

  # ---- Merge: collect the converted documents and commit ----
  merge:
    needs: [queen, workers]
    # always(), so one document failing does not strand the ones that succeeded.
    # Each .md is complete on its own here, so committing a subset is safe -- and
    # the skip-if-converted rule above means a rerun retries only the failures.
    # The run still shows red from the failed worker.
    if: ${{ always() && needs.queen.result == 'success' && needs.queen.outputs.count > 0 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # downloaded outside output/, so a failed cleanup can never get committed
      - name: Download converted documents
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect into output/
        run: |
          FOUND=$(find incoming -name '*.md' | wc -l)
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::no worker produced any Markdown"
            exit 1
          fi
          mkdir -p output
          # cp -a keeps each document under its own subdirectory, mirroring
          # document/ -- acts/ and acts-not-in-volume/ share filenames, so a
          # flat copy would silently drop one of each pair
          for d in incoming/batch-*/; do cp -a "$d." output/; done
          rm -rf incoming
          echo "✅ collected $FOUND documents"
      # Every previously converted .md came in with the checkout and this run's came
      # from the artifacts, so this is the one point where the corpus is whole.
      - name: Bundle each subdirectory
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          out = Path("output")
          for d in sorted(p for p in out.iterdir() if p.is_dir()):
              mds = sorted(d.rglob("*.md"))
              if not mds:
                  continue
              with zipfile.ZipFile(out / f"{d.name}.zip", "w") as zf:
                  for md in mds:
                      # entries keep the subdirectory prefix: acts/ and
                      # acts-not-in-volume/ share two filenames, so flat entries would
                      # collide as soon as both archives are extracted side by side
                      info = zipfile.ZipInfo(str(md.relative_to(out)),
                                             date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.external_attr = 0o644 << 16
                      zf.writestr(info, md.read_bytes())
              # the pinned timestamp above is what makes the bytes reproducible; with
              # a real mtime every run would commit a fresh binary blob for nothing
              print(f"  {d.name}.zip: {len(mds)} documents")
          PY
      - name: Upload final Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-markdown
          path: output/
          retention-days: 1

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref }} --rebase || true
          git add output/
          git diff --staged --quiet || git commit -m "📝 OCR: Markdown for $(git diff --staged --name-only | wc -l) document(s)"
          git push origin HEAD:${{ github.ref }}
