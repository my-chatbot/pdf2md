name: OCR PDFs (Tesseract)

on:
  workflow_dispatch:
  push:
    paths:
      - 'document/**/*.pdf'

permissions:
  contents: write

# the merge job commits to the branch; let a second push queue behind it
# rather than race it into a rejected push.
concurrency:
  group: ocr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- Queen: list the documents that still need converting ----
  # One job per PDF. A document already having its .md is dropped here rather
  # than skipped in the worker, so an unchanged corpus spawns no jobs at all and
  # a rerun after a partial failure only retries what actually failed.
  queen:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.list.outputs.docs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: List unconverted documents
        id: list
        # python, not bash: these filenames are Devanagari and json.dumps gets
        # the quoting right for the matrix
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          root, out = Path("document"), Path("output")
          todo, done = [], 0
          for pdf in sorted(root.rglob("*.pdf")):
              rel = pdf.relative_to(root)
              if (out / rel.with_suffix(".md")).exists():
                  done += 1
                  continue
              todo.append({"idx": len(todo) + 1, "path": str(rel)})
          print(f"docs={json.dumps(todo, ensure_ascii=False)}")
          print(f"count={len(todo)}")
          # stdout is $GITHUB_OUTPUT here, so the human-readable line goes to stderr
          print(f"::notice::{len(todo)} to convert, {done} already done", file=sys.stderr)
          PY

  # ---- Workers: one PDF each, MAX_PARALLEL at a time ----
  # max-parallel is the queue: GitHub starts the next document as soon as a slot
  # frees, so a corpus larger than the slot count needs no coordination from us.
  workers:
    needs: queen
    if: needs.queen.outputs.count > 0
    runs-on: ubuntu-latest
    timeout-minutes: 300
    name: ${{ matrix.path }}
    strategy:
      max-parallel: 10   # literal: the strategy block cannot read env or vars
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.queen.outputs.docs) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nep poppler-utils
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # writes to shard-out/, not output/: output/ holds the .md files already
      # committed, and uploading those would republish them from every job
      - name: Convert
        env:
          PDF: ${{ matrix.path }}   # via env, so a filename can never reach the shell
        run: |
          python3 scripts/pdf2md.py \
            --in document \
            --out shard-out \
            --only "$PDF" \
            --workers 2 \
            --dpi 300 \
            --lang nep+eng \
            --probe \
            --markers
      - name: Upload document
        uses: actions/upload-artifact@v4
        with:
          name: doc-${{ matrix.idx }}
          path: shard-out/
          if-no-files-found: error
          retention-days: 1

  # ---- Merge: collect the converted documents and commit ----
  merge:
    needs: [queen, workers]
    # always(), so one document failing does not strand the ones that succeeded.
    # Each .md is complete on its own here, so committing a subset is safe -- and
    # the skip-if-converted rule above means a rerun retries only the failures.
    # The run still shows red from the failed worker.
    if: ${{ always() && needs.queen.result == 'success' && needs.queen.outputs.count > 0 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # downloaded outside output/, so a failed cleanup can never get committed
      - name: Download converted documents
        uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect into output/
        run: |
          FOUND=$(find incoming -name '*.md' | wc -l)
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::no worker produced any Markdown"
            exit 1
          fi
          mkdir -p output
          # cp -a keeps each document under its own subdirectory, mirroring
          # document/ -- acts/ and acts-not-in-volume/ share filenames, so a
          # flat copy would silently drop one of each pair
          for d in incoming/doc-*/; do cp -a "$d." output/; done
          rm -rf incoming
          echo "✅ collected $FOUND documents"
      - name: Upload final Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-markdown
          path: output/
          retention-days: 1

      - name: Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref }} --rebase || true
          git add output/
          git diff --staged --quiet || git commit -m "📝 OCR: Markdown for $(git diff --staged --name-only | wc -l) document(s)"
          git push origin HEAD:${{ github.ref }}
